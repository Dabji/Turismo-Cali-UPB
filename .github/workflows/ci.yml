# =============================================================================
# CI Pipeline — Escudo de Integración Continua
# Turismo Cali — Consorcio "Ruta 7 Ríos"
# =============================================================================
# Se dispara en Pull Requests hacia main y develop.
# Ejecuta en la nube de GitHub (ubuntu-latest), NO en el self-hosted runner.
# Si algún job falla, el PR queda bloqueado y no se puede fusionar.
# =============================================================================

name: "🛡️ CI Pipeline"

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Frontend (React / Vite)
  # ─────────────────────────────────────────────
  frontend:
    name: "🎨 Frontend — Lint, Types & Build"
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v7

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 📦 Instalar dependencias (Monorepo)
        run: npm ci

      - name: 🔍 Verificar tipos (TypeScript)
        run: npx tsc -p frontend/tsconfig.json --noEmit

      - name: 🧹 Linter
        run: npm run lint --workspace=frontend --if-present

      - name: 🏗️ Compilar producción (Vite build)
        run: npm run build --workspace=frontend

  # ─────────────────────────────────────────────
  # JOB 2: Backend (Node.js / Express / Prisma)
  # ─────────────────────────────────────────────
  backend:
    name: "⚙️ Backend — Prisma, Lint, Types & Build"
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v7

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 📦 Instalar dependencias (Monorepo)
        run: npm ci

      - name: 🔄 Generar cliente Prisma
        run: npx prisma generate
        working-directory: ./backend

      - name: 🔍 Verificar tipos (TypeScript)
        run: npx tsc -p backend/tsconfig.json --noEmit

      - name: 🧹 Linter
        run: npm run lint --workspace=backend --if-present

      - name: 🏗️ Compilar producción
        run: npm run build --workspace=backend

      - name: 🧪 Ejecutar tests
        run: npm run test --workspace=backend --if-present
