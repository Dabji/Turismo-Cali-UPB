# =============================================================================
# Configuración del Labeler — Mapeo de rutas a etiquetas
# Turismo Cali — Consorcio "Ruta 7 Ríos"
# =============================================================================
# Formato: "nombre de etiqueta" → lista de patrones glob de archivos.
# Si un PR modifica archivos que coinciden, se le asigna la etiqueta.
# =============================================================================

"frontend 🎨":
  - changed-files:
      - any-glob-to-any-file: "frontend/**"

"backend ⚙️":
  - changed-files:
      - any-glob-to-any-file: "backend/**"

"infrastructure 🏗️":
  - changed-files:
      - any-glob-to-any-file: "infraestructura/**"

"ci/cd":
  - changed-files:
      - any-glob-to-any-file: ".github/**"

"documentation":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"
