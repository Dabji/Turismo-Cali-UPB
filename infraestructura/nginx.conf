# ============================================================
# Nginx Reverse Proxy — Turismo Cali
# Infraestructura WAN Corporativa
# ============================================================

# Redirigir HTTP a HTTPS
server {
    listen 80;
    server_name turismocali.local www.turismocali.local;

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor principal HTTPS
server {
    listen 443 ssl http2;
    server_name turismocali.local www.turismocali.local;

    # ========== Certificados SSL ==========
    ssl_certificate     /etc/ssl/certs/turismocali.crt;
    ssl_certificate_key /etc/ssl/private/turismocali.key;

    # ========== Configuración SSL segura ==========
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ========== Headers de seguridad ==========
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ========== Logs ==========
    access_log /var/log/nginx/turismocali_access.log;
    error_log  /var/log/nginx/turismocali_error.log;

    # ========== Compresión Gzip ==========
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
    gzip_comp_level 6;

    # ========== Límites de carga ==========
    client_max_body_size 10M;

    # ========== Frontend — React SPA ==========
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout para desarrollo con HMR
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ========== Backend API — Express ==========
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts para respuestas del backend (< 6 segundos objetivo)
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;

        # Rate limiting por zona
        limit_req zone=api_limit burst=20 nodelay;
    }

    # ========== Archivos estáticos (caché agresivo) ==========
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:5173;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ========== Health check ==========
    location /health {
        proxy_pass http://127.0.0.1:4000/api/health;
        access_log off;
    }
}

# ========== Rate limiting zone ==========
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
