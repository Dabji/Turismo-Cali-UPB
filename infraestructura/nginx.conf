# ============================================================
# Nginx Reverse Proxy — Turismo Cali
# Consorcio Turístico "Ruta 7 Ríos"
# Infraestructura WAN Corporativa — Track 2
# ============================================================
# HU-70: Landing Page funcional por HTTPS
# HU-79: Certificados SSL gestionados en el servidor de laboratorio
# ============================================================

# ========== Rate limiting zone (debe ir antes de los server blocks) ==========
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# ============================================================
# Server Block 1: HTTP → HTTPS Redirect (Puerto 80)
# Redirección permanente 301 de todo tráfico HTTP al puerto 443
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name turismocali.local www.turismocali.local;

    # Redirigir TODO el tráfico HTTP a HTTPS (301 Moved Permanently)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# Server Block 2: HTTPS Principal (Puerto 443)
# Terminación SSL con certificados autofirmados
# ============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name turismocali.local www.turismocali.local;

    # ========== Certificados SSL autofirmados (HU-79) ==========
    # Generados con:
    #   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
    #     -keyout /etc/ssl/private/turismocali.key \
    #     -out /etc/ssl/certs/turismocali.crt \
    #     -subj "/C=CO/ST=Valle del Cauca/L=Cali/O=Ruta 7 Rios/CN=turismocali.local"
    ssl_certificate     /etc/ssl/certs/turismocali.crt;
    ssl_certificate_key /etc/ssl/private/turismocali.key;

    # ========== Configuración SSL segura ==========
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ========== Headers de seguridad ==========
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ========== Logs ==========
    access_log /var/log/nginx/turismocali_access.log;
    error_log  /var/log/nginx/turismocali_error.log;

    # ========== Compresión Gzip ==========
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
    gzip_comp_level 6;

    # ========== Límites de carga ==========
    client_max_body_size 10M;

    # ========== Root — Frontend React/Vite (build estático) ==========
    # Ruta donde se despliega el resultado de `npm run build --workspace=frontend`
    # El output de Vite se genera en frontend/dist/
    root /var/www/turismocali/frontend/dist;
    index index.html;

    # ========== Frontend — React SPA (archivos estáticos) ==========
    # Sirve el build de producción de React. La directiva try_files
    # intenta servir el archivo solicitado; si no existe, devuelve
    # index.html para que React Router maneje la ruta (SPA fallback).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ========== Archivos estáticos con caché agresivo ==========
    # Los assets generados por Vite incluyen hash en el nombre,
    # por lo que pueden cachearse de forma inmutable.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ========== Backend API — Reverse Proxy a Express ==========
    # Todas las peticiones a /api/ se reenvían al servidor Express
    # corriendo en localhost:4000
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts para respuestas del backend
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;

        # Rate limiting por zona
        limit_req zone=api_limit burst=20 nodelay;
    }

    # ========== Health check ==========
    location /health {
        proxy_pass http://127.0.0.1:4000/api/health;
        access_log off;
    }

    # ========== Permitir /.well-known/ (ACME / Let's Encrypt) ==========
    location ^~ /.well-known/ {
        allow all;
    }

    # ========== Bloquear acceso a archivos ocultos ==========
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
