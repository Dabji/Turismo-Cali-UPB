# ============================================================
# Nginx Reverse Proxy - Turismo Cali
# Consorcio Turistico "Ruta 7 Rios"
# Infraestructura WAN Corporativa - Track 2
# ============================================================
# HU-70: Landing page funcional por HTTPS
# HU-78: Build publicado en /var/www/ruta7rios
# HU-79: Configuracion del servidor web
# ============================================================

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# ============================================================
# HTTP -> HTTPS
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name ruta7rios.page www.ruta7rios.page;

    return 301 https://$host$request_uri;
}

# ============================================================
# HTTPS principal
# ============================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ruta7rios.page www.ruta7rios.page;

    # Certificado autofirmado del laboratorio.
    # No versionar /etc/nginx/ssl/ruta7rios.key.
    ssl_certificate     /etc/nginx/ssl/ruta7rios.crt;
    ssl_certificate_key /etc/nginx/ssl/ruta7rios.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/ruta7rios_access.log;
    error_log  /var/log/nginx/ruta7rios_error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
    gzip_comp_level 6;

    client_max_body_size 10M;

    root /var/www/ruta7rios;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;

        limit_req zone=api_limit burst=20 nodelay;
    }

    location /health {
        proxy_pass http://127.0.0.1:3001/api/health;
        access_log off;
    }

    location ^~ /.well-known/ {
        allow all;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
